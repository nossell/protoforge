name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark and Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite (includes real-tshark E2E)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite (E2E auto-skips without tshark)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest tests -q
